[project]
name = "magsim"
version = "0.0.3"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Szymon Oramus"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magsim"]

[tool.ruff]
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "NPY",      # numpy-specific
    "PTH",      # use pathlib
    "RUF",      # ruff's own
]
extend-select = ["I"]  # Add import sorting
ignore = [
    "E501",     # line length — the formatter owns this
    "E741",     # ambiguous names: l, I, O
    "B905",     # zip() strict= — noisy in numeric code
]

[tool.ruff.lint.isort]
known-first-party = ["magsim"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]           # asserts are the point
"**/__init__.py" = ["F401"]    # re-exports

[tool.ruff.format]
docstring-code-format = true

[tool.uv]
  link-mode = "copy"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.6.3",
]
